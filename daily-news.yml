name: Daily bilingual news digest

on:
  schedule:
    # 00:00 UTC = 08:00 Taipei time (UTC+8). Adjust if you're in another timezone.
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" manually to test

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily news digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python daily_news.py
